# Applywright — profile config (EXAMPLE)
#
# Copy this whole profile.example/ directory to profile/ to get started:
#     cp -r profile.example profile
# then edit profile/ with your own details. profile/ is gitignored; this
# example stays in the repo as the template.
#
# Skills read these values; the cover-letter export passes the contact block
# to the PDF template. Nothing here is hard-coded in the engine.

identity:
  full_name: "Jordan Lin"
  # surname drives the exported PDF filename: "{surname} - Resume.pdf"
  surname: "Lin"
  # appended after the name on the CV (leave "" if none)
  credentials: "MBA"
  email: "jordan.lin@example.com"
  phone: "(555) 010-2837"

portfolio:
  # If url is empty, refresh-persona is skipped and profile/persona.md is
  # maintained by hand (or via the orientation interview, later milestone).
  url: "https://jordanlin.example"
  # AI-readable summary endpoint, if your site publishes one (else "").
  llms_txt: ""

utm:
  source_cv: "cv"
  source_cover_letter: "cover_letter"
  medium: "application"
  # campaign is set to the application short-id at generation time.

tracker:
  # "csv"   — zero setup, writes output/applications.csv (the default)
  # "notion" — requires the Notion MCP configured in Claude Code + the DB IDs below
  mode: "csv"
  csv_path: "output/applications.csv"
  notion:
    applications_db: ""
    companies_db: ""

style:
  # Font for the CV, cover letter, and exported documents. Default "Arial"
  # (near-universal on macOS and Windows). The chosen font is tried first, with
  # Arial as an automatic fallback if it isn't installed. To experiment, change
  # this one value and re-export — applywright export-pdf applies it everywhere.
  font: "Arial"

slots:
  # Dynamic CV bullet slots. Each row maps one {rolekey_n} placeholder in cv.md
  # to the master-bullets families it may draw from. This is the whole tailoring
  # contract: lock everything in cv.md except these slots (see cv-rules.md).
  #
  #   name     - the slot token WITHOUT braces; cv.md holds it as {name}
  #   role     - a substring of the role's "### **Company**, ..." header the
  #              slot sits under (used to confirm the slot is under the right role)
  #   families - inline list of master-bullets family prefixes this slot may use
  #              (keep the inline [A, B] form — check-slots hand-parses it)
  #   intent   - plain-language note on what this slot is for (guides selection)
  #   fill     - "auto"   = the pipeline selects a bullet for it every application
  #              "manual" = you tailor it on demand (ask Claude Code); the
  #                         pipeline never auto-fills it, and at rest it holds
  #                         real prose, not a {token}
  #
  # Global rules the selector honors across all auto slots: no family used twice
  # (each family is one project; it appears once), and spread themes so the CV
  # argues several points. Fewer, well-placed slots tailor harder than many.
  - name: meridian_1
    role: "Meridian Analytics"
    families: [PLATFORM, DATA]
    intent: "technical / platform depth in the current role"
    fill: auto
  - name: meridian_2
    role: "Meridian Analytics"
    families: [AI, PLATFORM]
    intent: "the JD's secondary theme in the current role"
    fill: auto
  - name: tideline_1
    role: "Tideline Software"
    families: [GROWTH, ONBOARD]
    intent: "growth / activation proof from the prior role"
    fill: auto
